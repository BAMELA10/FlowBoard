services:
  postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    
  server:
    build:
      context: ./server
      target: dev
    ports:
      - 3000:3000
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm run dev"
    depends_on:
      postgres: 
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      target: dev
    ports:
      - 5173:5173
    volumes:
      - ./client:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - server

volumes:
  pgdata:
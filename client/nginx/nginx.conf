# Bloc "server" : définit un serveur virtuel nginx.
# Un fichier dans conf.d/ ne contient QUE ce bloc (le bloc http{} est fourni par l'image nginx).
server {

    # nginx écoute sur le port 80 à l'intérieur du conteneur.
    # C'est le port HTTP standard ; le mapping vers l'hôte se fait via docker-compose (ex: "8080:80").
    listen 80;

    # Taille maximale du corps de la requête envoyée par le client.
    # Au-delà de 10 Mo, nginx rejette la requête avec une erreur 413.
    # Utile pour les uploads (images, fichiers) sans bloquer tout le trafic.
    client_max_body_size 10M;

    # Répertoire racine à partir duquel nginx sert les fichiers statiques.
    # C'est ici qu'on a copié le contenu de /app/dist (build Vite) dans le Dockerfile.
    root /usr/share/nginx/html;

    # Fichier servi par défaut lorsqu'une requête cible un dossier (ex: "/").
    # nginx cherchera index.html dans le dossier demandé.
    index index.html;

    # Bloc "location" : définit comment traiter les URI commençant par /api.
    # Sans slash final, ce bloc matche /api, /api/, /api/users, mais aussi /apiFoo (à éviter).
    # Préférez "location /api/" pour ne matcher que le préfixe exact.
    location /api {

        # Transfère la requête au backend identifié par le nom de service Docker "server", port 3000.
        # nginx résout "server" via le DNS interne de Docker Compose.
        # Sans slash final après le port, l'URI complète est transmise (ex: /api/users reste /api/users).
        # Avec un slash final (http://server:3000/), nginx retirerait le préfixe /api avant de transmettre.
        proxy_pass http://server:3000;

        # Force l'utilisation de HTTP/1.1 pour parler au backend.
        # Nécessaire pour supporter les headers keep-alive et les WebSockets.
        proxy_http_version 1.1;

        # Désactive l'envoi du header "Connection" au backend.
        # Évite les problèmes avec les proxys intermédiaires qui gèrent mal les connexions persistantes.
        proxy_set_header Connection "";

        # Conserve l'en-tête "Host" original envoyé par le client (ex: monapp.com).
        # Le backend voit ainsi le vrai domaine, utile pour la génération d'URL ou les cookies.
        proxy_set_header Host $host;

        # Transmet l'adresse IP réelle du client au backend.
        # Sans cela, le backend verrait l'IP du conteneur nginx, pas celle de l'utilisateur.
        proxy_set_header X-Real-IP $remote_addr;

        # Ajoute l'IP du client à la chaîne X-Forwarded-For.
        # Utile quand plusieurs proxys sont en chaîne : chaque proxy ajoute son IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Indique au backend si la requête originale était en HTTP ou HTTPS.
        # Le backend peut ainsi générer des URLs avec le bon schéma, ou forcer des cookies "secure".
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloc "location" pour les assets statiques générés par Vite.
    # Vite hash les noms de fichiers (ex: main.a1b2c3.js), donc leur contenu ne change jamais
    # pour un nom donné : on peut les cacher très longtemps sans risque.
    location /assets/ {

        # Demande au navigateur de conserver ces fichiers en cache pendant 1 an.
        # "expires" génère à la fois les en-têtes Expires et Cache-Control.
        expires 1y;

        # Ajoute un Cache-Control explicite avec "immutable".
        # Indique au navigateur qu'il ne doit JAMAIS revalider ce fichier tant qu'il n'a pas expiré.
        # Gain de performance : aucune requête conditionnelle (If-None-Match) sur ces assets.
        add_header Cache-Control "public, immutable";
    }

    # Bloc "location" avec le signe "=" : correspondance EXACTE sur /index.html uniquement.
    # Plus précis qu'un préfixe, ce bloc ne matche QUE cette URI précise.
    location = /index.html {

        # Empêche la mise en cache d'index.html.
        # Essentiel : index.html référence les assets hashés. S'il était caché,
        # les utilisateurs ne verraient jamais les nouveaux déploiements (ils utiliseraient
        # l'ancien index.html pointant vers d'anciens assets supprimés → 404 en cascade).
        add_header Cache-Control "no-cache";
    }

    # Bloc "location" par défaut : capture toutes les autres URI.
    # C'est ici que le SPA (React Router) est géré.
    location / {

        # Essaie dans l'ordre :
        # 1. $uri        → le fichier exact demandé (ex: /logo.png)
        # 2. $uri/       → le dossier correspondant
        # 3. /index.html → fallback si rien n'est trouvé
        #
        # Sans ce fallback, un rafraîchissement sur /dashboard renverrait une 404 nginx
        # car aucun fichier /dashboard n'existe physiquement. React Router prend ensuite
        # le relais côté client pour afficher la bonne page.
        try_files $uri $uri/ /index.html;
    }
}